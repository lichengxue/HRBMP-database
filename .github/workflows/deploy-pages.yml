name: Deploy GUI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure live archive
        env:
          HRBMP_SUPABASE_URL: ${{ vars.HRBMP_SUPABASE_URL }}
          HRBMP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.HRBMP_SUPABASE_PUBLISHABLE_KEY || secrets.HRBMP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/build_gui_config.js

      - name: Check archive behavior
        run: node --test tests/archive.test.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GUI artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: ./gui

      - name: Wait for Pages upload
        uses: actions/github-script@v7
        timeout-minutes: 2
        with:
          script: |
            const name = process.env.PAGES_ARTIFACT_NAME;
            for (let attempt = 0; attempt < 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo,
                run_id: context.runId,
                per_page: 100
              });
              const matches = data.artifacts.filter(item => item.name === name && !item.expired);
              if (matches.length === 1) {
                core.info(`Pages upload is ready: ${name}`);
                return;
              }
              if (matches.length > 1) throw new Error(`Duplicate Pages uploads: ${name}`);
              if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error(`Pages upload did not become available: ${name}`);

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
