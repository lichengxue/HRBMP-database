name: Deploy GUI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure live archive
        env:
          HRBMP_SUPABASE_URL: ${{ vars.HRBMP_SUPABASE_URL }}
          HRBMP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.HRBMP_SUPABASE_PUBLISHABLE_KEY || secrets.HRBMP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/build_gui_config.js

      - name: Check archive behavior
        run: node --test tests/archive.test.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GUI artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./gui

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
