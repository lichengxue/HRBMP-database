name: Deploy GUI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure live archive
        env:
          HRBMP_SUPABASE_URL: ${{ vars.HRBMP_SUPABASE_URL }}
          HRBMP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.HRBMP_SUPABASE_PUBLISHABLE_KEY || secrets.HRBMP_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/build_gui_config.js

      - name: Check archive behavior
        run: node --test tests/archive.test.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GUI artifact
        id: pages_upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: ./gui

      - name: Wait for Pages upload
        uses: actions/github-script@v7
        timeout-minutes: 2
        with:
          script: |
            const name = process.env.PAGES_ARTIFACT_NAME;
            for (let attempt = 0; attempt < 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo,
                run_id: context.runId,
                per_page: 100
              });
              const matches = data.artifacts.filter(item => item.name === name && !item.expired);
              if (matches.length === 1) {
                core.info(`Pages upload is ready: ${name}`);
                return;
              }
              if (matches.length > 1) throw new Error(`Duplicate Pages uploads: ${name}`);
              if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error(`Pages upload did not become available: ${name}`);

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v7
        timeout-minutes: 11
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = process.env.PAGES_ARTIFACT_ID;
            if (!/^\d+$/.test(artifactId || '')) throw new Error('The Pages upload has no artifact ID.');
            const oidcToken = await core.getIDToken();
            core.setSecret(oidcToken);
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: Number(artifactId),
              pages_build_version: context.sha,
              oidc_token: oidcToken
            });
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop();
            if (!deploymentId) throw new Error('Pages did not return a deployment ID.');
            core.setOutput('page_url', deployment.page_url);
            const failed = new Set([
              'deployment_failed', 'deployment_perms_error', 'deployment_content_failed',
              'deployment_cancelled', 'deployment_lost'
            ]);
            for (let attempt = 0; attempt < 120; attempt++) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...context.repo,
                deployment_id: deploymentId
              });
              if (data.status === 'succeed') {
                core.info('The HRBMP website is published.');
                return;
              }
              if (failed.has(data.status)) throw new Error(`Pages deployment failed: ${data.status}`);
              if (attempt < 119) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', {
              ...context.repo,
              deployment_id: deploymentId
            }).catch(() => {});
            throw new Error('The Pages deployment did not finish within ten minutes.');
